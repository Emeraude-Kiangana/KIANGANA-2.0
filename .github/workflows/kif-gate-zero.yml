name: KIF Gate Zero

on:
  workflow_dispatch:
  push:
    branches:
      - kif-gate-zero

permissions:
  contents: read

jobs:
  gate-zero:
    name: KIF Gate Zero validation
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Gate Zero diagnostics
        shell: bash
        run: |
          set +e

          SOURCE=FAIL
          INSTALL=FAIL
          SECRET=FAIL
          MODELS=FAIL
          MODEL_MATCH=FAIL
          UNIT=FAIL
          INTEGRATION=FAIL
          CLI=FAIL
          USAGE=FAIL
          HYGIENE=FAIL

          echo "=== ENVIRONMENT ==="
          python --version
          python -m pip --version
          python -m pip show setuptools | grep -i '^Version:' || true

          echo "=== SOURCE CONTENT MANIFEST ==="
          rm -rf /tmp/kif-g0
          mkdir -p /tmp/kif-g0
          unzip -q kif/gate-zero.zip -d /tmp/kif-g0
          if [ $? -eq 0 ]; then
            cd /tmp/kif-g0
            sha256sum -c "$GITHUB_WORKSPACE/kif/GATE_ZERO_MANIFEST.sha256"
            if [ $? -eq 0 ]; then SOURCE=PASS; fi
          fi
          echo "SOURCE=$SOURCE"

          echo "=== G0-02 CLEAN INSTALL ==="
          if [ "$SOURCE" = "PASS" ]; then
            cd /tmp/kif-g0
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
            if [ $? -eq 0 ]; then
              python -m pip show setuptools | grep -i '^Version:' || true
              python -c "import kif; print('KIF_VERSION=' + kif.__version__)"
              python -c "from kif.core.models import TaskEnvelope; print('KIF_IMPORT=OK')"
              if [ $? -eq 0 ]; then INSTALL=PASS; fi
            fi
          fi
          echo "INSTALL=$INSTALL"

          echo "=== G0-03 SECRET ==="
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            SECRET=PASS
            echo "DEEPSEEK_API_KEY=SET"
          else
            echo "DEEPSEEK_API_KEY=MISSING"
          fi

          MODEL="${DEEPSEEK_MODEL:-deepseek-flash}"
          echo "DEEPSEEK_MODEL=$MODEL"

          echo "=== DEEPSEEK /models ==="
          if [ "$SECRET" = "PASS" ]; then
            curl --fail-with-body --silent --show-error \
              https://api.deepseek.com/models \
              -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
              -o /tmp/deepseek-models.json
            if [ $? -eq 0 ]; then
              MODELS=PASS
              jq -r '.data[].id' /tmp/deepseek-models.json
            fi
          fi
          echo "MODELS=$MODELS"

          echo "=== MODEL MATCH ==="
          if [ "$MODELS" = "PASS" ]; then
            jq -r --arg m "$MODEL" '.data[] | select(.id==$m) | .id' /tmp/deepseek-models.json | grep -q .
            if [ $? -eq 0 ]; then
              MODEL_MATCH=PASS
              echo "MODEL_MATCH=OK"
            else
              echo "MODEL_MATCH=FAIL"
            fi
          fi

          echo "=== G0-06 UNIT TESTS ==="
          if [ "$INSTALL" = "PASS" ]; then
            cd /tmp/kif-g0
            pytest tests/unit -q
            if [ $? -eq 0 ]; then UNIT=PASS; fi
          fi
          echo "UNIT=$UNIT"

          echo "=== G0-04/05 REAL INTEGRATION ==="
          if [ "$INSTALL" = "PASS" ] && [ "$SECRET" = "PASS" ] && [ "$MODEL_MATCH" = "PASS" ]; then
            cd /tmp/kif-g0
            export DEEPSEEK_MODEL="$MODEL"
            pytest tests/integration -q -s
            if [ $? -eq 0 ]; then INTEGRATION=PASS; fi
          fi
          echo "INTEGRATION=$INTEGRATION"

          echo "=== CLI END-TO-END ==="
          if [ "$INTEGRATION" = "PASS" ]; then
            cd /tmp/kif-g0
            export DEEPSEEK_MODEL="$MODEL"
            kif ask "Reply with exactly one word: pong"
            if [ $? -eq 0 ]; then CLI=PASS; fi
          fi
          echo "CLI=$CLI"

          echo "=== G0-08 USAGE EVIDENCE ==="
          if [ "$CLI" = "PASS" ]; then
            cd /tmp/kif-g0
            if [ -s tests/data/usage.jsonl ]; then
              tail -1 tests/data/usage.jsonl | jq .
              if [ $? -eq 0 ]; then USAGE=PASS; fi
            fi
          fi
          echo "USAGE=$USAGE"

          echo "=== G0-07 SECRET HYGIENE ==="
          cd "$GITHUB_WORKSPACE"
          if git ls-files | xargs grep -nE 'sk-[A-Za-z0-9]{16,}'; then
            echo "SECRET_SCAN=FAIL"
          else
            HYGIENE=PASS
            echo "SECRET_SCAN=CLEAN"
          fi
          git status --short
          git rev-parse HEAD

          {
            echo "### KIF Gate Zero"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Source manifest | $SOURCE |"
            echo "| G0-02 clean install | $INSTALL |"
            echo "| G0-03 credential | $SECRET |"
            echo "| DeepSeek /models | $MODELS |"
            echo "| MODEL_MATCH | $MODEL_MATCH |"
            echo "| G0-06 unit tests | $UNIT |"
            echo "| G0-04/05 integration | $INTEGRATION |"
            echo "| CLI smoke | $CLI |"
            echo "| G0-08 usage evidence | $USAGE |"
            echo "| G0-07 secret hygiene | $HYGIENE |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SOURCE" = "PASS" ] && \
             [ "$INSTALL" = "PASS" ] && \
             [ "$SECRET" = "PASS" ] && \
             [ "$MODELS" = "PASS" ] && \
             [ "$MODEL_MATCH" = "PASS" ] && \
             [ "$UNIT" = "PASS" ] && \
             [ "$INTEGRATION" = "PASS" ] && \
             [ "$CLI" = "PASS" ] && \
             [ "$USAGE" = "PASS" ] && \
             [ "$HYGIENE" = "PASS" ]; then
            echo "GATE_ZERO=PASS"
            exit 0
          fi

          echo "GATE_ZERO=BLOCKED"
          exit 1
